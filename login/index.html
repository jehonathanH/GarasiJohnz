<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="login.css">

<head> 
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- link css  -->
    <link rel="stylesheet" href="./templatemo-style.css">

    <!-- icons  -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
        integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">

    <title>Login Garasi Johnz</title>
</head>

<body>
    <div class=" flex-r container">
        <div class="flex-r login-wrapper">
            <div class="login-text">
                <div class="logo">
                    <span>GarasiJohnz</span>
                </div>
                <h1>Sign In</h1>

                <form class="flex-c" id="loginForm">
                    <div class="input-box">
                        <span class="label">username</span>
                        <div class=" flex-r input">
                            <input type="text" id="username" placeholder="nama" required="required">
                            <i class="fas fa-at"></i>
                        </div>
                    </div>
                    
                    <div class="input-box">
                        <span class="label">password</span>
                        <div class="flex-r input">
                            <input type="password" id="password" placeholder="12345678" required="required">
                            <i class="fas fa-lock"></i>
                        </div>
                    </div>

                    <!-- <div class="check">
                        <input type="checkbox" name="" id="">
                        <span>Saya sudah membaca dan menyetujui</span>
                    </div> -->
                        <span>ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ</span>
                    <button class="btn" type="submit">Masuk</button>
                    <span class="extra-line">
                        <span>Belum punya akun?</span>
                        <a href="signin.html">Sign Up</a>
                    </span>
                    
                </form>

            </div>
        </div>
    </div>
      <script src="js/login.js"></script>
    <div id="alertBox" style="
        display:none;
        background:#ffb3b3;
        padding:10px;
        margin-bottom:10px;
        border-radius:5px;
        color:#900;
        text-align:center;
    "></div>
</body>
</html>
