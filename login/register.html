<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="login.css">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- link css  -->
    <link rel="stylesheet" href="./login.css">

    <!-- icons  -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
        integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">

    <title>Login Garasi Johnz</title>
</head>

<body>
    <div class=" flex-r container">
        <div class="flex-r login-wrapper">
            <div class="login-text">
                <div class="logo">
                    <span>GarasiJohnz</span>
                </div>
                <h1>Sign Up</h1>

                <form class="flex-c" id="registerForm">

                    <div class="input-box">
                        <span class="label">email</span>
                        <div class=" flex-r input">
                            <input type="email" id="email" placeholder="email@gmail.com">
                            <i class="fas fa-at"></i>
                        </div>
                    </div>
                    
                    <div class="input-box">
                        <span class="label">username</span>
                        <div class=" flex-r input">
                            <input type="text" id="username" placeholder="nama">
                            <i class="fas fa-at"></i>
                        </div>
                    </div>
                    
                    <div class="input-box">
                        <span class="label">password</span>
                        <div class="flex-r input">
                            <input type="password" id="password" placeholder="12345678">
                            <i class="fas fa-lock"></i>
                        </div>
                    </div>

                    <div class="check">
                        <input type="checkbox" name="" id="">
                        <span>Saya sudah membaca dan menyetujui</span>
                    </div>

                    <button class="btn" type="kirim">Buat Akun</button>
                    <span class="extra-line">
                        <span>Sudah punya akun?</span>
                        <a href="signin.html">Sign In</a>
                    </span>
                    
                </form>

            </div>
        </div>
    </div>

  <script src="../../shared/js/form-utils.js"></script>
<p id="message"></p>
  <script src="js/register.js" defer></script>
  
</body>
</html>
