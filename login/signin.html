<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="login.css">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./templatemo-style.css">

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
        integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">

    <title>Login Garasi Johnz</title>
</head>

<body>
    <div class=" flex-r container">
        <div class="flex-r login-wrapper">
            <div class="login-text">
                <div class="logo">
                    <span>GarasiJohnz</span>
                </div>
                <h1>Sign In</h1>

                <form class="flex-c" action="../index.html" method="GET"id="login">
                    <div class="input-box">
                        <span class="label">username</span>
                        <div class=" flex-r input">
                            <input type="text" placeholder="nama" required id="username">
                            <i class="fas fa-at"></i>
                        </div>
                    </div>
                    
                    <div class="input-box">
                        <span class="label">password</span>
                        <div class="flex-r input">
                            <input type="password" placeholder="12345678" required id="password">
                            <i class="fas fa-lock"></i>
                        </div>
                    </div>

                    <div class="check">
                        <input type="checkbox" name="" id="">
                        <span>Ingat saya di perangkat iniㅤㅤㅤㅤㅤㅤㅤ</span>
                    </div>

                    <button class="btn" type="submit">Login</button>
                    <span class="extra-line">
                        <span>Belum punya akun?</span>
                        <a href="./index.html">Sign Up</a>
                    </span>
                    
                </form>

            </div>
        </div>
    </div>
        <script src="js/login.js"></script>
</body>
</html>
